name: Update Construct 3 PDFs

# Runs every Wednesday 10:00 UTC (after Scirra's typical Tuesday evening UK release)
on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-download even if CDN unchanged'
        type: boolean
        default: false
      target:
        description: 'Target: manual, addon-sdk, game-services, all'
        type: choice
        options: ['all', 'manual', 'addon-sdk', 'game-services']
        default: 'all'

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium --with-deps

      - name: Check for updates
        id: check
        run: |
          OUTPUT=$(python scripts/update_pdfs.py check --target ${{ inputs.target || 'all' }})
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "CHANGED\|NEW"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Download combined PDFs
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/update_pdfs.py download --target ${{ inputs.target || 'all' }} $FORCE_FLAG

      - name: Generate individual PDFs (full deploy)
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: python scripts/update_pdfs.py generate --target ${{ inputs.target || 'all' }} --delay 1000

      - name: Update READMEs
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: python scripts/update_pdfs.py readme --target ${{ inputs.target || 'all' }}

      - name: Get version for branch name
        if: steps.check.outputs.changed == 'true' || inputs.force
        id: version
        run: |
          VERSION=$(python -c "import json; s=json.load(open('scripts/state.json')); print(s.get('construct_version','unknown'))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true' || inputs.force
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update PDFs to construct-version ${{ steps.version.outputs.version }}"
          title: "Update PDFs to construct-version ${{ steps.version.outputs.version }}"
          body: |
            Automated PDF update from construct-static.com CDN.

            - construct-version: `${{ steps.version.outputs.version }}`
            - Target: `${{ inputs.target || 'all' }}`

            Auto-generated by GitHub Actions.
          branch: pdfs-v${{ steps.version.outputs.version }}
          delete-branch: true
