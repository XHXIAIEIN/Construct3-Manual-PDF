name: Update Construct 3 PDFs
run-name: "${{ inputs.version != '' && format('Update Construct 3 PDFs to {0}', inputs.version) || format('Check Construct 3 PDFs · {0} #{1}', github.event_name, github.run_number) }}"

# Runs every Wednesday 10:00 UTC (after Scirra's typical Tuesday evening UK release)
on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (e.g. 1757). Leave empty to auto-check.'
        required: false
        default: ''
      force:
        description: 'Force re-download even if CDN unchanged'
        type: boolean
        default: false
      target:
        description: 'Target: manual, addon-sdk, game-services, all'
        type: choice
        options: ['all', 'manual', 'addon-sdk', 'game-services']
        default: 'all'

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests for version check
        run: python -m pip install -q requests

      - name: Determine version and mode
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -e
          CURRENT=$(python -c "import json; s=json.load(open('scripts/state.json')); print(s.get('construct_version','unknown'))")

          if [ -n "$INPUT_VERSION" ]; then
            LATEST="$INPUT_VERSION"
            MODE="update"
          else
            LATEST=$(python scripts/check_version.py)
            MODE="check"
          fi

          if [ "$CURRENT" = "$LATEST" ]; then
            CHANGED="false"
          else
            CHANGED="true"
          fi

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT

          if [ "$CHANGED" = "true" ]; then
            echo "## $CURRENT → $LATEST ($MODE)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## $CURRENT (up to date)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Current=$CURRENT  Latest=$LATEST  Mode=$MODE  Changed=$CHANGED"

      # CHECK mode + new version: dispatch self with version label
      - name: Dispatch update run with version label
        if: steps.ver.outputs.mode == 'check' && steps.ver.outputs.changed == 'true' && steps.ver.outputs.latest != 'no_change'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update.yml -f version='${{ steps.ver.outputs.latest }}'
          echo "::notice::Dispatched update run with version ${{ steps.ver.outputs.latest }}"

      - name: Install dependencies (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update'
        run: pip install -r scripts/requirements.txt

      - name: Check for updates (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update'
        id: check
        run: |
          OUTPUT=$(python scripts/update_pdfs.py check --target ${{ inputs.target || 'all' }})
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "CHANGED\|NEW" || [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Download combined PDFs (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update' && (steps.check.outputs.changed == 'true' || inputs.force)
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/update_pdfs.py download --target ${{ inputs.target || 'all' }} $FORCE_FLAG

      - name: Split into individual PDFs (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update' && (steps.check.outputs.changed == 'true' || inputs.force)
        run: python scripts/update_pdfs.py generate --target ${{ inputs.target || 'all' }}

      - name: Update READMEs (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update' && (steps.check.outputs.changed == 'true' || inputs.force)
        run: python scripts/update_pdfs.py readme --target ${{ inputs.target || 'all' }}

      - name: Create Pull Request (${{ steps.ver.outputs.latest }})
        if: steps.ver.outputs.mode == 'update' && (steps.check.outputs.changed == 'true' || inputs.force)
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update PDFs to construct-version ${{ steps.ver.outputs.latest }}"
          title: "Update PDFs to construct-version ${{ steps.ver.outputs.latest }}"
          body: |
            ${{ steps.ver.outputs.current }} → ${{ steps.ver.outputs.latest }}

            Automated PDF update from construct-static.com CDN.
            Target: `${{ inputs.target || 'all' }}`

            Auto-generated by GitHub Actions.
          branch: pdfs-v${{ steps.ver.outputs.latest }}
          delete-branch: true

      - name: Enable auto-merge for PR (${{ steps.ver.outputs.latest }})
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          # Wait for status checks to complete (max 10 minutes)
          for i in {1..60}; do
            STATUS=$(gh pr checks $PR_NUMBER --json state --jq '.[0].state // "pending"' 2>/dev/null || echo "pending")
            if [ "$STATUS" = "PASS" ]; then
              echo "✓ All checks passed"
              break
            elif [ "$STATUS" = "FAIL" ]; then
              echo "✗ Checks failed, skipping auto-merge"
              exit 1
            fi
            echo "Waiting for checks... ($i/60)"
            sleep 10
          done

          # Merge PR with squash strategy
          gh pr merge $PR_NUMBER --auto --squash || echo "Could not enable auto-merge (may already be merged)"
